
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>当選シミュレーター</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --blue: #0055a4;
  --red: #ef4135;
  --ink: #222222;
  --muted: #777777;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 28px 16px;
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  color: var(--ink);
  background: linear-gradient(
    135deg, #eef5ff 0%, #ffffff 50%, #fff0f3 100%
  );
}

.container {
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 22px;
}

.flag {
  display: flex;
  width: 90px;
  height: 7px;
  margin: 0 auto 14px;
  overflow: hidden;
  border-radius: 10px;
}

.flag span {
  flex: 1;
}

.flag .blue { background: var(--blue); }
.flag .white { background: #ffffff; }
.flag .red { background: var(--red); }

h1 {
  margin: 0;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: .03em;
}

.subtitle {
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
}

.card {
  padding: 22px 20px;
  background: #ffffff;
  border: 1px solid rgba(0, 0, 0, .04);
  border-radius: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .07);
}

.question {
  margin: 2px 0 20px;
  text-align: center;
  font-size: 16px;
  font-weight: 800;
}

.buttons {
  display: flex;
  gap: 12px;
}

.choice {
  flex: 1;
  min-width: 0;
  min-height: 145px;
  padding: 20px 10px;
  border: 0;
  border-radius: 18px;
  color: #ffffff;
  cursor: pointer;
  font: inherit;
  transition: transform .12s, filter .12s;
  -webkit-tap-highlight-color: transparent;
}

.choice:hover {
  filter: brightness(1.04);
}

.choice:active {
  transform: scale(.96);
}

.choice:focus-visible {
  outline: 3px solid #222222;
  outline-offset: 3px;
}

.single { background: var(--blue); }
.pair { background: var(--red); }

.icon {
  min-height: 42px;
  margin-bottom: 6px;
  font-size: 30px;
}

.name {
  font-size: 18px;
  font-weight: 800;
}

.count {
  margin-top: 5px;
  font-size: 13px;
  opacity: .92;
}

.result {
  display: none;
  margin-top: 22px;
  padding: 26px 15px 20px;
  border-radius: 20px;
  background: #fafafa;
  text-align: center;
}

.result.show {
  display: block;
}

.draw-count {
  display: inline-block;
  margin-bottom: 16px;
  padding: 7px 13px;
  border-radius: 999px;
  background: #edf3fa;
  color: var(--blue);
  font-size: 13px;
  font-weight: 800;
}

.picked-type {
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 13px;
}

.result-icon {
  margin-bottom: 7px;
  font-size: 58px;
  line-height: 1.2;
}

.result-text {
  font-size: 32px;
  font-weight: 900;
}

.result-sub {
  margin-top: 9px;
  color: var(--muted);
  font-size: 14px;
}

.result.win .result-text {
  color: var(--red);
}

.result.lose .result-text {
  color: var(--blue);
}

.hint {
  margin-top: 18px;
  color: #888888;
  text-align: center;
  font-size: 11px;
  line-height: 1.6;
}

@media (max-width: 360px) {
  body { padding: 20px 12px; }
  .card { padding: 18px 14px; }
  .buttons { gap: 9px; }
  .choice { min-height: 132px; }
  h1 { font-size: 22px; }
}
</style>
</head>

<body>
<main class="container">

  <header class="header">
    <div class="flag" aria-hidden="true">
      <span class="blue"></span>
      <span class="white"></span>
      <span class="red"></span>
    </div>

    <h1>🎟️ ChristmasEvent<br>当落シミュレーター</h1>
    <div class="subtitle">どちらで運試しする？✨</div>
  </header>

  <section class="card" aria-label="抽選">

    <p class="question">申し込むのはどっち？</p>

    <div class="buttons">
      <button
        class="choice single"
        type="button"
        onclick="lottery('single')">

        <div class="icon" aria-hidden="true">🎫</div>
        <div class="name">単番</div>

      </button>

      <button
        class="choice pair"
        type="button"
        onclick="lottery('pair')">

        <div class="icon" aria-hidden="true">🎟️🎟️</div>
        <div class="name">連番</div>

      </button>
    </div>

    <section
      id="result"
      class="result"
      aria-live="polite"
      aria-atomic="true">

      <div id="drawCount" class="draw-count">
        抽選回数：0回目
      </div>

      <div id="pickedType" class="picked-type"></div>
      <div id="resultIcon" class="result-icon"></div>
      <div id="resultText" class="result-text"></div>
      <div id="resultSub" class="result-sub"></div>

    </section>

    <p class="hint">
      単番・連番のボタンを押すたびに再抽選されます🎲
    </p>

  </section>
</main>

<script>
// お遊び用の当選確率（画面には表示しません）
const SINGLE_RATE = 0.0247;
const PAIR_RATE = 0.0213;

// ページを開いている間の累計抽選回数
let drawCount = 0;

function lottery(type) {
  // ボタンを押すたびに回数を加算
  drawCount += 1;

  // 単番・2連それぞれの確率で抽選
  const rate = type === "single"
    ? SINGLE_RATE
    : PAIR_RATE;

  const isWin = Math.random() < rate;

  const result = document.getElementById("result");

  // 抽選回数と今回の申込タイプを更新
  document.getElementById("drawCount").textContent =
    `抽選回数：${drawCount}回目`;

  document.getElementById("pickedType").textContent =
    type === "single"
      ? "今回の抽選：単番"
      : "今回の抽選：連番";

  // 当選・落選を表示
  document.getElementById("resultIcon").textContent =
    isWin ? "🎉" : "😭";

  document.getElementById("resultText").textContent =
    isWin ? "当選！！" : "落選…";

  document.getElementById("resultSub").textContent =
    isWin
      ? (type === "single"
          ? "おめでとう！単番を引き当てました！✨"
          : "おめでとう！連番を引き当てました！！✨")
      : "今回は残念…🥲";

  // 結果の色を更新して、結果エリアを表示
  result.classList.remove("win", "lose");
  result.classList.add("show", isWin ? "win" : "lose");
}
</script>

</body>
</html>
