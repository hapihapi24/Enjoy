<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当選シミュレーター</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 18px;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;

    background: linear-gradient(
        135deg,
        #eef5ff,
        #ffffff 50%,
        #fff0f3
    );

    color: #222;
}

.container {
    max-width: 430px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.flag {
    width: 90px;
    height: 7px;
    display: flex;
    margin: 0 auto 15px;
    border-radius: 10px;
    overflow: hidden;
}

.blue {
    background: #0055a4;
    flex: 1;
}

.white {
    background: #fff;
    flex: 1;
}

.red {
    background: #ef4135;
    flex: 1;
}

h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.subtitle {
    margin-top: 8px;
    font-size: 13px;
    color: #777;
}

.card {
    background: #fff;
    border-radius: 24px;
    padding: 24px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.question {
    text-align: center;
    font-weight: 800;
    font-size: 16px;
    margin-bottom: 18px;
}

.buttons {
    display: flex;
    gap: 12px;
}

.choice {
    flex: 1;
    border: none;
    border-radius: 18px;
    padding: 22px 10px;
    color: #fff;
    cursor: pointer;
    transition: transform 0.12s;
}

.choice:active {
    transform: scale(0.94);
}

.single {
    background: #0055a4;
}

.pair {
    background: #ef4135;
}

.icon {
    font-size: 32px;
    margin-bottom: 7px;
}

.name {
    font-size: 18px;
    font-weight: 800;
}

.count {
    margin-top: 4px;
    font-size: 13px;
    opacity: 0.9;
}

.result {
    margin-top: 22px;
    display: none;
    text-align: center;
    padding: 30px 15px;
    border-radius: 20px;
    background: #fafafa;
}

.result.show {
    display: block;
}

.result-icon {
    font-size: 58px;
    margin-bottom: 8px;
}

.result-text {
    font-size: 32px;
    font-weight: 900;
}

.result-sub {
    margin-top: 8px;
    font-size: 14px;
    color: #777;
}

.again {
    margin-top: 20px;
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 14px;
    background: #222;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.win .result-text {
    color: #ef4135;
}

.lose .result-text {
    color: #0055a4;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="flag">
            <div class="blue"></div>
            <div class="white"></div>
            <div class="red"></div>
        </div>

        <h1>🎟️ 当選シミュレーター</h1>

        <div class="subtitle">
            どちらで運試しする？✨
        </div>

    </div>


    <div class="card">

        <div class="question">
            申し込むのはどっち？
        </div>

        <div class="buttons">

            <button
                class="choice single"
                onclick="lottery('single')">

                <div class="icon">🎫</div>

                <div class="name">
                    単番
                </div>

                <div class="count">
                    1枚
                </div>

            </button>


            <button
                class="choice pair"
                onclick="lottery('pair')">

                <div class="icon">🎟️🎟️</div>

                <div class="name">
                    2連
                </div>

                <div class="count">
                    2枚
                </div>

            </button>

        </div>


        <div id="result" class="result">

            <div id="resultIcon" class="result-icon">
            </div>

            <div id="resultText" class="result-text">
            </div>

            <div id="resultSub" class="result-sub">
            </div>

        </div>

    </div>

</div>


<script>

function lottery(type) {

    // 内部で使用する当選確率
    const singleRate = 0.0247;
    const pairRate = 0.0213;

    const rate =
        type === "single"
        ? singleRate
        : pairRate;

    const isWin = Math.random() < rate;

    const result = document.getElementById("result");
    const icon = document.getElementById("resultIcon");
    const text = document.getElementById("resultText");
    const sub = document.getElementById("resultSub");

    result.className = "result show";

    if (isWin) {

        result.classList.add("win");

        icon.textContent = "🎉";
        text.textContent = "当選！！";
        sub.textContent =
            type === "single"
            ? "単番、引き当てました！✨"
            : "2連、引き当てました！！✨";

    } else {

        result.classList.add("lose");

        icon.textContent = "😭";
        text.textContent = "落選…";
        sub.textContent =
            type === "single"
            ? "今回は残念…🥲"
            : "今回は残念…🥲";

    }

    result.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}


function resetResult() {

    const result = document.getElementById("result");

    result.className = "result";

}

</script>

</body>
</html>
